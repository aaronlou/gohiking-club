[server]
host = "0.0.0.0"
port = 3000

[database]
url = "postgres://postgres:postgres@localhost:5432/gohiking"

[storage]
backend = "local"  # "s3", "veimagex" or "local"

[storage.s3]
bucket = "gohiking-photos"
endpoint = "http://localhost:9000"
region = "us-east-1"
public_endpoint = "http://localhost:9000"

[storage.veimagex]
service_id = ""
domain = ""
access_key = ""
secret_key = ""

[storage.local]
base_dir = "./uploads"
public_url_prefix = "http://localhost:3000/uploads"

[auth]
jwt_secret = "change-me-in-production-use-a-long-random-string"
jwt_expires_in_secs = 2592000

[ai_scoring]
active = "gemini"
threshold = 60.0
concurrent_limit = 5

[ai_scoring.providers.gemini]
model = "gemini-3.1-flash-lite"

[ai_scoring.providers.claude]
model = "claude-sonnet-4-20250506"
max_tokens = 500

[ai_scoring.providers.openai]
model = "gpt-4o"
max_tokens = 500

[ai_scoring.providers.ollama]
endpoint = "http://localhost:11434"
model = "llava"

[agent]
active = "claude"
system_prompt = "You are GoHiking.club's AI assistant. You help users with hiking events, photo sharing, team management, and outdoor activities. You have access to tools that can search photos, list events, and look up user profiles. Be friendly, concise, and helpful."
max_history_messages = 20

[agent.providers.claude]
model = "claude-sonnet-4-20250514"
max_tokens = 2048

[agent.providers.openai]
model = "gpt-4o"
max_tokens = 2048

[agent.providers.gemini]
model = "gemini-2.0-flash"
max_tokens = 2048

[agent.providers.ollama]
endpoint = "http://localhost:11434"
model = "llama3.2"

[agent.skills]
workspace_dir = "./skills"
enabled = true
