[server]
host = "0.0.0.0"
port = 3000

[database]
url = "postgres://postgres:postgres@localhost:5432/gohiking"

[storage]
bucket = "gohiking-photos"
endpoint = "http://localhost:9000"  # MinIO for development
region = "us-east-1"
public_endpoint = "http://localhost:9000"  # Dev: same as endpoint

[auth]
jwt_secret = "change-me-in-production-use-a-long-random-string"
jwt_expires_in_secs = 604800

[ai_scoring]
active = "claude"
threshold = 60.0
concurrent_limit = 5

[ai_scoring.providers.claude]
model = "claude-sonnet-4-20250506"
max_tokens = 500

[ai_scoring.providers.openai]
model = "gpt-4o"
max_tokens = 500

[ai_scoring.providers.ollama]
endpoint = "http://localhost:11434"
model = "llava"
