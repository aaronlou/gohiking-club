services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gohiking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/gohiking
      APP__SERVER__HOST: "0.0.0.0"
      APP__SERVER__PORT: "3000"
      APP__STORAGE__BACKEND: ${STORAGE_BACKEND:-s3}
      APP__STORAGE__S3__ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      APP__STORAGE__S3__REGION: ${S3_REGION:-us-east-1}
      APP__STORAGE__S3__BUCKET: ${S3_BUCKET:-gohiking-photos}
      APP__STORAGE__S3__PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost/storage}
      APP__STORAGE__VEIMAGEX__SERVICE_ID: ${VEIMAGEX_SERVICE_ID:-}
      APP__STORAGE__VEIMAGEX__DOMAIN: ${VEIMAGEX_DOMAIN:-}
      APP__STORAGE__VEIMAGEX__ACCESS_KEY: ${VEIMAGEX_ACCESS_KEY:-}
      APP__STORAGE__VEIMAGEX__SECRET_KEY: ${VEIMAGEX_SECRET_KEY:-}
      APP__AUTH__JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP__AUTH__JWT_EXPIRES_IN_SECS: "604800"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  minio_data:
